name: Bug report
description: Report a reproducible problem with the Paper plugin.
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What happened and what did you expect?" }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Versions, description: Plugin, Paper and Java versions }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs, description: Remove tokens, IP addresses and player data first. }
