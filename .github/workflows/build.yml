name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with: { validate-wrappers: true }
      - name: Verify pinned core
        run: scripts/verify-core.sh --remote
      - name: Build and test
        run: ./gradlew clean build --no-daemon
      - name: SHA-256
        run: sha256sum build/libs/anx-network-bridge-paper-*.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anx-network-bridge-paper
          path: build/libs/anx-network-bridge-paper-*.jar
          if-no-files-found: error
          retention-days: 30
